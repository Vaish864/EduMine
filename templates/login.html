
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | EduMine</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="login-page">

    <header class="login-header">
        <a href="/" class="landing-brand">
            <span class="landing-brand-mark">E</span>
            <span>EduMine</span>
        </a>

        <a href="/" class="login-home-link">← Back to home</a>
    </header>

    <main class="login-main">

        <section class="login-card">

            <div class="login-icon">E</div>

            <p class="login-eyebrow">WELCOME TO EDUMINE</p>
            <h1>Welcome back.</h1>

            <p class="login-description">
                Sign in to access your EduMine workspace.
            </p>

            <form method="POST" action="/login" class="login-form">

                <div class="login-field">
                    <label for="email">Email address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="login-field">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <div class="login-field">
                    <label for="role">Sign in as</label>
                    <select id="role" name="role" required>
                        <option value="student">Student</option>
                        <option value="faculty">Faculty</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>

                <button type="submit" class="login-submit-button">
                    Login to EduMine <span aria-hidden="true">→</span>
                </button>

            </form>

            <div class="login-security-note">
                <span aria-hidden="true">◇</span>
                Access your workspace securely.
            </div>

        </section>

        <p class="login-footer">
            Student Feedback Text Mining and Opinion Analysis System
        </p>

    </main>

</body>
</html>
